name: build profile assets

on:
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:
  push:
    branches: [main]
    # Only the inputs to this pipeline. Koi and README-only pushes don't re-run it.
    paths:
      - "scripts/**"
      - "conf/**"
      - ".github/workflows/assets.yml"

permissions:
  contents: write

# Shared with koi.yml: pushes to main are serialized, never raced.
concurrency:
  group: profile-main
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: generate 3d contribution graph
        uses: yoshi389111/github-profile-3d-contrib@0.7.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: shubhamtaywade82
          SETTING_JSON: conf/3d-settings.json

      - name: make skyline animation loop
        run: python3 scripts/loopify.py profile-3d-contrib/profile-skyline.svg

      - name: build repo cards
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/build_cards.py

      - name: refresh package versions in README
        # A registry outage must not block the asset refresh. The script exits
        # without touching README.md when any lookup fails.
        continue-on-error: true
        run: python3 scripts/sync_packages.py

      - name: commit refreshed assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/cards profile-3d-contrib README.md
          if git diff --cached --quiet; then
            echo "no asset changes"
            exit 0
          fi
          git commit --quiet -m "chore: refresh profile assets"
          git pull --rebase --quiet origin main
          git push --quiet origin HEAD:main
