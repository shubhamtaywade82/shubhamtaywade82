<svg width="300" height="140" viewBox="0 0 300 140" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#161b22"/>
      <stop offset="100%" style="stop-color:#0d1117"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#58a6ff"/>
      <stop offset="100%" style="stop-color:#58a6ffcc"/>
    </linearGradient>
    <filter id="cardGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="300" height="140" rx="12" fill="url(#cardBg)" stroke="#30363d" stroke-width="1"/>
  <rect x="0" y="0" width="300" height="4" rx="12" fill="url(#accent)"/>
  
  <text x="20" y="40" font-family="'JetBrains Mono', monospace" font-size="16" font-weight="600" fill="#e6edf3">pinescript-dev-workspace</text>
  
  <text x="20" y="70" font-family="'JetBrains Mono', monospace" font-size="12" fill="#8b949e">shubhamtaywade82/pinescript-development-workspace</text>
  
  <g transform="translate(20, 100)">
    <circle cx="0" cy="0" r="3" fill="#58a6ff" opacity="0.8"/>
    <text x="10" y="4" font-family="'JetBrains Mono', monospace" font-size="12" fill="#58a6ff" font-weight="600">18</text>
    <text x="10" y="20" font-family="'JetBrains Mono', monospace" font-size="10" fill="#8b949e">stars</text>
  </g>
  
  <g transform="translate(260, 100)">
    <text x="0" y="4" font-family="'JetBrains Mono', monospace" font-size="12" fill="#484f58" text-anchor="end">⭐</text>
  </g>
</svg>